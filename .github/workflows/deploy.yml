name: Build, Verify, and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DATABASE_URL: postgresql://smoke:smoke-password@localhost:5432/point_sekolah_ci
  DIRECT_URL: postgresql://smoke:smoke-password@localhost:5432/point_sekolah_ci
  NEXTAUTH_SECRET: ci-only-secret-that-is-never-used-in-production
  NEXTAUTH_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke-password
          POSTGRES_DB: point_sekolah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d point_sekolah_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  build-smoke-publish:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SCHOOL_NAME=${{ vars.NEXT_PUBLIC_SCHOOL_NAME || 'SMA Islam Al-Azhar 1 Jakarta' }}
            NEXT_PUBLIC_SCHOOL_SHORT=${{ vars.NEXT_PUBLIC_SCHOOL_SHORT || 'Al-Azhar 1' }}
            NEXT_PUBLIC_SCHOOL_NAME_SHORT=${{ vars.NEXT_PUBLIC_SCHOOL_NAME_SHORT || 'SMA Islam Al Azhar 1' }}
            NEXT_PUBLIC_STUDENT_DOMAIN=${{ vars.NEXT_PUBLIC_STUDENT_DOMAIN || 'smaalazhar1.sch.id' }}
            NEXT_PUBLIC_STAFF_DOMAIN=${{ vars.NEXT_PUBLIC_STAFF_DOMAIN || 'smaalazhar1.sch.id' }}
            NEXT_PUBLIC_CRITICAL_POINTS=${{ vars.NEXT_PUBLIC_CRITICAL_POINTS || '75' }}
            NEXT_PUBLIC_WARNING_POINTS=${{ vars.NEXT_PUBLIC_WARNING_POINTS || '50' }}
            NEXT_PUBLIC_HEAVY_VIOLATION_POINTS=${{ vars.NEXT_PUBLIC_HEAVY_VIOLATION_POINTS || '20' }}
            NEXT_PUBLIC_AUTH_GOOGLE_ENABLED=${{ vars.NEXT_PUBLIC_AUTH_GOOGLE_ENABLED || 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test exact image
        env:
          APP_IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          COMPOSE_PROJECT_NAME: point-sekolah-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --env-file /dev/null -f docker-compose.smoke.yml logs app || true
            docker compose --env-file /dev/null -f docker-compose.smoke.yml down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose --env-file /dev/null -f docker-compose.smoke.yml up -d db --wait --wait-timeout 120
          docker compose --env-file /dev/null -f docker-compose.smoke.yml run --rm app npx prisma migrate deploy
          docker compose --env-file /dev/null -f docker-compose.smoke.yml up -d app --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready
          curl --fail --silent --show-error http://127.0.0.1:3000/login >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/dashboard)" = "307"
          docker compose --env-file /dev/null -f docker-compose.smoke.yml exec -T app npx prisma migrate status
          docker compose --env-file /dev/null -f docker-compose.smoke.yml exec -T app npm run db:seed
          docker compose --env-file /dev/null -f docker-compose.smoke.yml exec -T app npm run db:seed
      - name: Publish verified image
        run: |
          docker tag "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" "${REGISTRY}/${IMAGE_NAME}:latest"
          docker push "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"

  deploy:
    needs: build-smoke-publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy verified SHA to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR,REPO_URL,ENV_FILE_CONTENT,ORIGIN_CERT,ORIGIN_KEY,DEPLOY_SHA,APP_IMAGE
          script: |
            set -eu
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER"
            fi

            sudo mkdir -p /opt/point-sekolah
            sudo chown "$USER:$USER" /opt/point-sekolah
            if [ ! -d /opt/point-sekolah/.git ]; then
              git clone "$REPO_URL" /opt/point-sekolah
            fi
            cd /opt/point-sekolah
            git switch main
            git pull --ff-only origin main

            # Tulis .env via Python (hindari echo + history expand `!` di password).
            # Strip kutip ASCII/curly, validasi key wajib, sync DATABASE_URL dari POSTGRES_*.
            python3 - <<'PY'
            import os
            from pathlib import Path
            from urllib.parse import quote_plus

            raw = os.environ.get("ENV_FILE_CONTENT", "")
            if raw.startswith("\ufeff"):
                raw = raw.lstrip("\ufeff")
            if not raw.strip():
                raise SystemExit("ENV_FILE_CONTENT kosong")

            QUOTES = "\"'“”‘’"

            def strip_wrapping_quotes(value):
                value = value.strip()
                while len(value) >= 2 and value[0] in QUOTES and value[-1] in QUOTES:
                    value = value[1:-1].strip()
                return value

            env = {}
            for line in raw.splitlines():
                stripped = line.strip()
                if not stripped or stripped.startswith("#") or "=" not in line:
                    continue
                key, value = line.split("=", 1)
                key = strip_wrapping_quotes(key.replace("\ufeff", "").strip())
                env[key] = strip_wrapping_quotes(value)

            required = [
                "POSTGRES_USER",
                "POSTGRES_PASSWORD",
                "POSTGRES_DB",
                "NEXTAUTH_SECRET",
                "NEXTAUTH_URL",
                "CRON_SECRET",
            ]
            missing = [k for k in required if not env.get(k, "").strip()]
            if missing:
                raise SystemExit("ENV_FILE_CONTENT kurang key: %s" % ", ".join(missing))

            user = env["POSTGRES_USER"].strip()
            password = env["POSTGRES_PASSWORD"].strip()
            dbname = env["POSTGRES_DB"].strip()
            if any(ch in user for ch in QUOTES) or any(ch in dbname for ch in QUOTES):
                raise SystemExit("POSTGRES_USER/DB masih mengandung kutip — paste ulang tanpa kutip")

            # Username bot tanpa @
            bot = env.get("TELEGRAM_BOT_USERNAME", "").strip().lstrip("@")
            if bot:
                env["TELEGRAM_BOT_USERNAME"] = bot

            if not env.get("TZ", "").strip():
                env["TZ"] = "Asia/Jakarta"

            url = "postgresql://%s:%s@db:5432/%s" % (user, quote_plus(password), dbname)
            env["DATABASE_URL"] = url
            env["DIRECT_URL"] = url
            env["POSTGRES_USER"] = user
            env["POSTGRES_PASSWORD"] = password
            env["POSTGRES_DB"] = dbname

            preferred = [
                "POSTGRES_USER",
                "POSTGRES_PASSWORD",
                "POSTGRES_DB",
                "DATABASE_URL",
                "DIRECT_URL",
                "NEXTAUTH_SECRET",
                "NEXTAUTH_URL",
                "CRON_SECRET",
                "TZ",
            ]
            out = []
            seen = set()
            for key in preferred:
                if key in env:
                    out.append("%s=%s" % (key, env[key]))
                    seen.add(key)
            for key in sorted(env.keys()):
                if key in seen:
                    continue
                out.append("%s=%s" % (key, env[key]))

            Path(".env").write_text("\n".join(out) + "\n", encoding="utf-8")
            print(
                "env ok: user=%r db=%r password_len=%s cron_len=%s nextauth_url=%s urls_synced=1"
                % (
                    user,
                    dbname,
                    len(password),
                    len(env["CRON_SECRET"]),
                    env["NEXTAUTH_URL"],
                )
            )
            PY
            mkdir -p certs
            python3 -c 'import os; from pathlib import Path; Path("certs/origin-cert.pem").write_text(os.environ["ORIGIN_CERT"], encoding="utf-8"); Path("certs/origin-key.pem").write_text(os.environ["ORIGIN_KEY"], encoding="utf-8")'
            chmod 600 certs/origin-key.pem .env

            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            export APP_IMAGE
            sudo --preserve-env=APP_IMAGE docker compose pull app
            sudo --preserve-env=APP_IMAGE docker compose up -d db --wait --wait-timeout 120
            sudo --preserve-env=APP_IMAGE docker compose run --rm app npx prisma migrate deploy
            sudo --preserve-env=APP_IMAGE docker compose run --rm app npm run db:sync-pasal-15
            sudo --preserve-env=APP_IMAGE docker compose up -d --wait --wait-timeout 180
            # Caddyfile + origin cert ditulis ulang tiap deploy; force recreate agar TLS host baru ter-load
            sudo --preserve-env=APP_IMAGE docker compose up -d --force-recreate --no-deps caddy --wait --wait-timeout 60
            sudo --preserve-env=APP_IMAGE docker compose exec -T app node -e \
              "fetch('http://127.0.0.1:3000/api/health/ready').then(async r=>{console.log(await r.text());process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"
            sudo docker image prune -af
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
          ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
          APP_IMAGE: ghcr.io/rofimain/point-sekolah:${{ github.sha }}
