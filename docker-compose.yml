name: point-sekolah

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/rofimain/point-sekolah:latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  cron:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl tzdata
        # Remisi otomatis tiap hari jam 02:00 (set TZ di .env, mis. Asia/Jakarta)
        echo "0 2 * * * curl -fsS -X POST -H \"x-cron-secret: $${CRON_SECRET}\" http://app:3000/api/cron/quiet-month-points >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        # Purge log akses >12 bulan tiap hari jam 03:15
        echo "15 3 * * * curl -fsS -X POST -H \"x-cron-secret: $${CRON_SECRET}\" http://app:3000/api/cron/access-log-purge >> /proc/1/fd/1 2>&1" >> /etc/crontabs/root
        echo "Cron terpasang: remisi 02:00, purge access-log 03:15 (retensi 12 bulan). Pastikan CRON_SECRET ada di .env."
        crond -f -l 8

volumes:
  db_data:
  caddy_data:

networks:
  internal:
